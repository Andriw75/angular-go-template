<div class="container">
  <form class="form" (submit)="handleSubmit($event)">
    <h2 class="title">Cambiar contraseña</h2>
    <p class="hint">Debes cambiar la contraseña inicial antes de continuar.</p>

    <div class="inputGroup" [class.filled]="currentPassword()">
      <input
        type="password"
        autocomplete="current-password"
        [value]="currentPassword()"
        (input)="currentPassword.set($any($event.target).value)"
        [disabled]="isLoading()"
      />
      <label class="label">Contraseña actual</label>
    </div>

    <div class="inputGroup" [class.filled]="newPassword()">
      <input
        type="password"
        autocomplete="new-password"
        [value]="newPassword()"
        (input)="newPassword.set($any($event.target).value)"
        [disabled]="isLoading()"
      />
      <label class="label">Nueva contraseña</label>
    </div>

    <div class="inputGroup" [class.filled]="confirmPassword()">
      <input
        type="password"
        autocomplete="new-password"
        [value]="confirmPassword()"
        (input)="confirmPassword.set($any($event.target).value)"
        [disabled]="isLoading()"
      />
      <label class="label">Confirmar contraseña</label>
    </div>

    <p class="rules">Mínimo 12 caracteres. No uses contraseñas comunes.</p>

    @if (error()) {
      <div class="formError">{{ error() }}</div>
    }

    <button type="submit" class="submitButton" [disabled]="isLoading()">
      @if (isLoading()) {
        <icon-spinner size="1.2em" class="spinner" />
      } @else {
        Guardar contraseña
      }
    </button>
  </form>
</div>
