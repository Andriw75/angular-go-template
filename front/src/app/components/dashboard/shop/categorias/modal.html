<div class="overlay" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ isEditing() ? 'Editar Categoría' : 'Nueva Categoría' }}</h2>
      <button class="close-btn" (click)="close()">&times;</button>
    </div>

    <form (ngSubmit)="onSubmit()" class="modal-body">
      <div class="grid">
        <div class="field field--full">
          <label>Nombre *</label>
          <input type="text" [(ngModel)]="form.nombre" name="nombre" required />
        </div>
        <div class="field field--full">
          <label>Descripción</label>
          <textarea [(ngModel)]="form.descripcion" name="descripcion" rows="3"></textarea>
        </div>
        <div class="field field--inline">
          <label>
            <input type="checkbox" [(ngModel)]="form.activo" name="activo" />
            Activo
          </label>
        </div>

        @if (isEditing()) {
          <div class="field field--full images-section">
            <label>Imágenes</label>
            <div class="image-legend">
              <span class="legend-item"><span class="dot dot--uploaded"></span> En servidor</span>
              <span class="legend-item"><span class="dot dot--pending"></span> Por subir</span>
              <span class="legend-item"><span class="dot dot--deleted"></span> Por eliminar</span>
            </div>
            <div class="image-grid">
              @for (card of cards(); track card.key) {
                <div
                  class="image-card"
                  [class.card--uploaded]="card.status === 'uploaded'"
                  [class.card--pending]="card.status === 'pending-upload'"
                  [class.card--deleted]="card.status === 'pending-delete'"
                  [class.dragging]="draggingKey() === card.key"
                  draggable="true"
                  (dragstart)="onDragStart($event, card)"
                  (dragover)="onDragOver($event)"
                  (drop)="onDrop($event, card)"
                  (dragend)="onDragEnd()"
                >
                  <span class="drag-handle" title="Arrastrar para reordenar">⋮⋮</span>
                  <img [src]="card.url" alt="imagen" />
                  <span class="image-status">{{ statusLabel(card) }}</span>
                  <button
                    type="button"
                    class="image-remove"
                    [title]="card.status === 'pending-delete' ? 'Restaurar' : card.status === 'uploaded' ? 'Marcar para eliminar' : 'Quitar'"
                    (click)="removeOrRestore(card)"
                  >
                    {{ card.status === 'pending-delete' ? '↩' : '✕' }}
                  </button>
                </div>
              } @empty {
                <span class="image-empty">Sin imágenes</span>
              }
            </div>
            <div class="image-upload">
              <input type="file" accept="image/*" multiple (change)="onFilesSelected($event)" [disabled]="applying()" />
            </div>
            @if (hasPending || applying()) {
              <div class="image-actions">
                <button
                  type="button"
                  class="btn btn--secondary btn--discard"
                  [disabled]="applying()"
                  (click)="discardChanges()"
                >
                  Descartar cambios
                </button>
                <button
                  type="button"
                  class="btn btn--secondary btn--apply"
                  [disabled]="applying() || !hasPending"
                  (click)="applyImages()"
                >
                  {{ applying() ? 'Aplicando...' : pendingSummary }}
                </button>
              </div>
            }
          </div>
        }
      </div>

      @if (error()) {
        <div class="form-error">{{ error() }}</div>
      }

      <div class="modal-actions">
        <button type="button" class="btn btn--secondary" (click)="close()">Cancelar</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving()">
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
