<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Template</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162d4a">
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 11000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 38%, #24476f 0%, #162d4a 55%, #0d1c31 100%);
      color: #e2e8f0;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #boot-splash.boot-splash--leaving {
      opacity: 0;
      visibility: hidden;
    }

    .boot-splash__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
    }

    .boot-splash__logo {
      width: 190px;
      max-width: 62vw;
      height: auto;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.45));
      animation: boot-float 2.6s ease-in-out infinite;
    }

    .boot-splash__status {
      margin: 0;
      font: 600 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    .boot-splash__track {
      position: relative;
      width: 190px;
      max-width: 62vw;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .boot-splash__track::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 42%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(251, 146, 60, 0), #fb923c 45%, #f97316);
      animation: boot-slide 1.15s ease-in-out infinite;
    }

    @keyframes boot-float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes boot-slide {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-splash__logo,
      .boot-splash__track::after {
        animation: none;
      }
      .boot-splash__track::after {
        left: 0;
        width: 100%;
        opacity: 0.8;
      }
    }
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-live="polite" aria-label="Cargando Template">
    <div class="boot-splash__inner">
      <img class="boot-splash__logo" src="branding/logo.png" alt="" width="190" height="51" />
      <p class="boot-splash__status">Cargando Template</p>
      <span class="boot-splash__track" aria-hidden="true"></span>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
