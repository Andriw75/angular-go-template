version: 2

updates:
  - package-ecosystem: gomod
    directory: /back
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - security
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: monthly
    # Un PR agrupado de minor/patch + como máximo un major pendiente.
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - security
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - security
    groups:
      github-actions:
        patterns:
          - "*"
