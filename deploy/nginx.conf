# ============================================================
# nginx — Template (config de deploy)
# Copia este server block dentro de nginx.conf (dentro de "http { ... }")
# o úsalo como referencia para tu server existente en el puerto 5000.
# ============================================================

server {
    listen       5000;
    server_name  localhost;

    client_max_body_size 500M;

    # ---------- Frontend (Angular build --base-href=/template/) ----------
    location /template/ {
        alias "C:/Andriw 2/nginx-1.28.0/html/template/";
        try_files $uri $uri/ /template/index.html;
    }

    # ---------- Archivos públicos (imágenes) ----------
    location /template/public/ {
        alias "C:/Andriw 2/nginx-1.28.0/html/template/public/";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ---------- API Go (proxy) ----------
    location /template/api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
