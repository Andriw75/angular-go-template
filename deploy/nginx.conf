# ============================================================
# nginx — Template (config de deploy)
#
# Este archivo se incluye DENTRO de "http { ... }" (las zonas de
# limit_req/limit_conn también viven en http).
#
# Arquitectura:
#   - /template/            -> SPA Angular + estáticos (base-href /template/)
#   - /template/public/     -> imágenes estáticas públicas (tienda)
#   - /template/api/        -> proxy al backend Go (incluye /archivos
#                              protegidos que Go sirve con validación)
#
# Producción: añadir un server 443 con TLS, redirigir 80->443 y activar HSTS.
# El bloque TLS está comentado al final como referencia.
# ============================================================

# Rate limiting. nginx corta floods por IP antes de llegar a Go.
limit_req_zone $binary_remote_addr zone=ecc_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ecc_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ecc_conn:10m;
limit_req_status 429;

server {
    listen       5000;
    server_name  localhost;

    server_tokens off;

    # Límites de body y timeouts de red.
    client_max_body_size 120M;
    client_body_timeout  30s;
    client_header_timeout 15s;
    send_timeout         60s;
    keepalive_timeout    65s;

    # ---------- Frontend (Angular build --base-href=/template/) ----------
    location /template/ {
        alias "C:/Andriw 2/nginx-1.28.0/html/template/";
        try_files $uri $uri/ /template/index.html;
    }

    # ---------- Estáticos públicos (no imágenes de entidades) ----------
    # Las imágenes de categorías/productos se sirven por la API.
    location /template/public/ {
        alias "C:/Andriw 2/nginx-1.28.0/html/template/public/";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ---------- Bloqueo de rutas de archivos protegidos ----------
    # template/archivos existe dentro de esta raíz, pero nginx nunca debe
    # servirlo estáticamente. Solo Go lo sirve vía /template/api/archivos/.
    location ^~ /template/archivos {
        return 404;
    }

    # No servir archivos ocultos (.env, .git, etc.).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ---------- Login: límite estricto ----------
    location = /template/api/auth/token {
        limit_req zone=ecc_auth burst=5 nodelay;
        limit_conn ecc_conn 10;

        proxy_pass http://127.0.0.1:8080/auth/token;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- API Go (proxy) ----------
    # Los archivos protegidos (/archivos/{filename}) los sirve Go con
    # validacion de visibilidad. nginx solo hace proxy.
    location /template/api/ {
        limit_req zone=ecc_api burst=60 nodelay;
        limit_conn ecc_conn 20;

        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

